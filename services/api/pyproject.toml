[project]
name = "api"
version = "0.1.0"
description = "Deterministic application API for the AI agent SaaS template"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141,<1.0",
    "uvicorn[standard]>=0.40,<1.0",
    "pydantic>=2.12,<3.0",
    "pydantic-settings>=2.13,<3.0",
    "sqlalchemy[asyncio]>=2.0.40,<3.0",
    "alembic>=1.19,<2.0",
    "asyncpg>=0.30,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "boto3>=1.42,<2.0",
    "httpx>=0.28,<1.0",
    "structlog>=26.1,<27.0",
    "mangum>=0.22,<1.0",
    "python-dotenv>=1.2,<2.0",
    "pyjwt[crypto]>=2.10,<3.0",
    "saas-contracts",
]

[tool.uv.sources]
saas-contracts = { path = "../../packages/contracts", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.0,<10.0",
    "pytest-asyncio>=1.4,<2.0",
    "ruff>=0.16,<1.0",
    "mypy>=2.3,<3.0",
    "aiosqlite>=0.22,<1.0",
    "boto3-stubs[s3,dynamodb]>=1.42,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Session scope so the integration suite can share one engine and one event
# loop across a module; the unit suite creates its own engine per test anyway.
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "C4", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"alembic/**" = ["I001"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
plugins = []
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = ["mangum.*"]
ignore_missing_imports = true
