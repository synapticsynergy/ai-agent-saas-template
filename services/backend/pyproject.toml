[project]
name = "backend"
version = "0.1.0"
description = "Application API, agent runtime and MCP server for the AI agent SaaS template"
requires-python = ">=3.12"
dependencies = [
    # Web / ASGI
    "fastapi>=0.141,<1.0",
    "uvicorn[standard]>=0.52,<1.0",
    "sse-starlette>=3.0,<4.0",
    "httpx>=0.28,<1.0",
    "python-dotenv>=1.2,<2.0",
    "structlog>=26.1,<27.0",

    # Agent
    "anthropic>=1.5,<2.0",
    "ag-ui-protocol>=0.1.22,<1.0",

    # MCP
    "mcp>=2.2,<3.0",

    # Persistence
    "sqlalchemy[asyncio]>=2.0.40,<3.0",
    "alembic>=1.19,<2.0",
    "asyncpg>=0.30,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "boto3>=1.42,<2.0",

    # Auth / validation
    "pyjwt[crypto]>=2.10,<3.0",
    "pydantic>=2.12,<3.0",
    "pydantic-settings>=2.15,<3.0",

    "saas-contracts",
]

[tool.uv.sources]
saas-contracts = { path = "../../packages/contracts", editable = true }

[dependency-groups]
dev = [
    "fastapi-cli>=0.0.13,<1.0",
    "pytest>=9.0,<10.0",
    "pytest-asyncio>=1.4,<2.0",
    "ruff>=0.16,<1.0",
    "mypy>=2.3,<3.0",
    "respx>=0.22,<1.0",
    "aiosqlite>=0.22,<1.0",
    "boto3-stubs[s3,dynamodb]>=1.42,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Three packages, one distribution. They stay independent — none imports
# another except through HTTP or the shared contracts — so splitting them back
# into separate deployables is a deployment change, not a refactor (ADR-009).
[tool.hatch.build.targets.wheel]
packages = ["app", "agent_app", "mcp_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Session scope so a suite can share one engine and one event loop across a
# module. The agent and MCP suites previously ran function-scoped; they do not
# depend on the distinction, but a new async fixture that holds per-test state
# does, so prefer an explicit `@pytest.mark.asyncio(loop_scope=...)` there.
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "C4", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"alembic/**" = ["I001"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
exclude = ["alembic/versions"]
