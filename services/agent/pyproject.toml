[project]
name = "agent"
version = "0.1.0"
description = "Strands agent for Bedrock AgentCore Runtime"
requires-python = ">=3.12"
dependencies = [
    "strands-agents[anthropic]>=1.55,<2.0",
    "bedrock-agentcore>=1.22,<2.0",
    "ag-ui-protocol>=0.1.22,<1.0",
    "fastapi>=0.141,<1.0",
    "uvicorn[standard]>=0.52,<1.0",
    "sse-starlette>=3.0,<4.0",
    "pydantic>=2.12,<2.41.3",
    "pydantic-settings>=2.15,<3.0",
    "httpx>=0.28,<1.0",
    "structlog>=26.1,<27.0",
    "saas-contracts",
]

[tool.uv.sources]
saas-contracts = { path = "../../packages/contracts", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.0,<10.0",
    "pytest-asyncio>=1.4,<2.0",
    "ruff>=0.16,<1.0",
    "mypy>=2.3,<3.0",
    "respx>=0.22,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "C4", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
