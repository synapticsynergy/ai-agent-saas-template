# Fly.io deployment for the backend (API + agent + MCP server, ADR-009).
#
#   fly launch --copy-config --no-deploy   # first time: creates the app
#   fly secrets set DATABASE_URL=... ANTHROPIC_API_KEY=... WORKOS_API_KEY=...
#   fly deploy
#
# The web app deploys separately to Vercel; see docs/DEPLOYMENT.md.

app = "ai-agent-saas-backend"
primary_region = "sea"

[build]
  dockerfile = "services/backend/Dockerfile"
  build-target = "runtime"

[http_service]
  internal_port = 8000
  force_https = true
  auto_start_machines = true

  # Deliberately not auto-stopping. A sleeping machine is fine for a web app
  # behind a browser, but an MCP client such as Claude Desktop connects on its
  # own schedule and a cold start reads as a broken server.
  auto_stop_machines = false
  min_machines_running = 1

[[http_service.checks]]
  path = "/health"
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"

[env]
  APP_ENV = "production"
  # The MCP transport answers 421 for any Host it was not told to expect.
  # This must match the hostname clients actually use.
  MCP_ALLOWED_HOSTS = "ai-agent-saas-backend.fly.dev"
