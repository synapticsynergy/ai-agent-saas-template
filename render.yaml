# Render deployment for the backend (API + agent + MCP server, ADR-009).
#
# Render reads this file from the repository root: New → Blueprint.
# The web app deploys separately to Vercel; see docs/DEPLOYMENT.md.
#
# Note on the free plan: free web services sleep after inactivity and cold-start
# on the next request. That is tolerable for a browser, but an MCP client such
# as Claude Desktop connects on its own schedule and reads the delay as a broken
# server. Use a paid instance if the MCP endpoint matters to you.

services:
  - type: web
    name: ai-agent-saas-backend
    runtime: docker
    dockerfilePath: ./services/backend/Dockerfile
    dockerContext: .
    dockerCommand: sh -c "exec uvicorn asgi:app --host 0.0.0.0 --port ${PORT:-8000}"
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      # The MCP transport answers 421 for any Host it was not told to expect.
      - key: MCP_ALLOWED_HOSTS
        fromService:
          type: web
          name: ai-agent-saas-backend
          property: host
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SYNC_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: WORKOS_API_KEY
        sync: false
      - key: WORKOS_CLIENT_ID
        sync: false
