# Local development topology.
#
#   make infra-up     → postgres only (recommended; run apps natively)
#   docker compose up → everything, including the app services
#
# The API, the agent and the MCP server are one ASGI application and one
# container (ADR-009), reachable at /, /agent and /mcp on port 8000.

name: ai-agent-saas

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
      target: dev
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-app}
      API_CORS_ORIGINS: http://localhost:3000
      # In-process, but still addressed over HTTP so the agent keeps talking to
      # its tools exactly as it would against a standalone MCP server.
      MCP_SERVER_URL: http://backend:8000/mcp
      API_BASE_URL: http://backend:8000
      # The compose service name is the Host header other containers send.
      MCP_ALLOWED_HOSTS: backend:8000,localhost:8000,127.0.0.1:8000
    ports:
      - "8000:8000"
    volumes:
      # Mount the source at the same path the image uses, and keep the
      # container's own virtualenv: a bare bind mount would shadow it with the
      # host's, whose interpreter symlinks point at the developer's machine.
      - ./services/backend:/app/services/backend
      - backend-venv:/app/services/backend/.venv
      - ./packages/contracts:/app/packages/contracts:ro
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-local}
      API_BASE_URL: http://backend:8000
      AGENT_BASE_URL: http://backend:8000/agent
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app/apps/web
      - web-node-modules:/app/apps/web/node_modules
      - web-next-cache:/app/apps/web/.next
    depends_on:
      - backend

volumes:
  postgres-data:
  backend-venv:
  web-node-modules:
  web-next-cache:
