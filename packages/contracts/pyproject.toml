[project]
name = "saas-contracts"
version = "0.1.0"
description = "Shared domain contracts for the AI agent SaaS template"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.12,<3.0"]

[dependency-groups]
dev = ["ruff>=0.16,<1.0", "mypy>=2.3,<3.0", "pytest>=9.0,<10.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saas_contracts"]

[tool.hatch.build.targets.wheel.force-include]
"src/saas_contracts/py.typed" = "saas_contracts/py.typed"
"src/saas_contracts/fixtures/data.json" = "saas_contracts/fixtures/data.json"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
