name: Deploy dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # OIDC: no long-lived AWS keys in GitHub secrets.

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
    secrets: inherit
