name: Deploy staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
    secrets: inherit

  # Staging is the release-candidate environment, so it is validated against
  # the real deployment rather than only in CI.
  validate:
    name: Release-candidate validation
    needs: deploy
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - run: |
          uv sync --project services/agent
          pnpm install --frozen-lockfile
          pnpm --filter e2e exec playwright install --with-deps chromium

      - name: staging-check
        run: ./scripts/staging-check.sh staging
        env:
          E2E_BASE_URL: ${{ vars.APP_URL }}
          NEXT_PUBLIC_APP_URL: ${{ vars.APP_URL }}
          EVAL_THRESHOLD: "1.0"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: staging-validation
          path: |
            tests/e2e/playwright-report/
            eval-results.json
          retention-days: 14
