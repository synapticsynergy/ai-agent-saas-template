# Root pytest configuration for the cross-service integration suite.
#
# Each service also has its own [tool.pytest.ini_options]; those apply when
# pytest runs with that service as the rootdir. This file covers `tests/`,
# which spans services and therefore has no single project root.
[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests/integration
